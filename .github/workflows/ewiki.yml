name: ewiki

# Builds the engineering wiki (ewiki/hugo.toml, a Hugo render of this repo's
# Markdown on the shared ewiki theme) on every PR and push that touches it. A
# broken link between notes fails the build. On main, a passing build deploys
# the Worker in ewiki/wrangler.jsonc to scooby-engine-ewiki.barefootbetters.com.
# Run it by hand (workflow_dispatch) to redeploy.

on:
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'
      - 'tools/*/README.md'
      - 'ewiki/**'
      - '.github/workflows/ewiki.yml'
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'tools/*/README.md'
      - 'ewiki/**'
      - '.github/workflows/ewiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ewiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # why: fetch-depth 0 (full history) so Hugo's GitInfo can resolve each
      # page's last commit for the header's "Last reviewed" line (enableGitInfo
      # in ewiki/hugo.toml). A shallow checkout has only HEAD, so .Lastmod would
      # fall back to the runner's checkout time.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # why: private pages live in barefootbetters/scooby-engine-private and
      # render only on this Access-gated wiki (ewiki/hugo.toml, the _private
      # mount). The read-only deploy key is a repo secret; without it (forks,
      # or before Jeff adds it) the wiki builds public pages only. This log is
      # public, so nothing below prints private page names or text.
      - name: Check for the private-pages key
        id: private
        env:
          KEY: ${{ secrets.PRIVATE_PAGES_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PRIVATE_PAGES_DEPLOY_KEY is not set, so the wiki builds without its private pages."
          fi

      - name: Check out the private pages
        if: steps.private.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: barefootbetters/scooby-engine-private
          ssh-key: ${{ secrets.PRIVATE_PAGES_DEPLOY_KEY }}
          path: _private
          persist-credentials: false

      # why: the decompdecomp room link (WP-011) is a live invite, so it is in
      # neither repository. It's the DECOMP_ROOM_URL repo secret, written here
      # over the DECOMP-ROOM-LINK placeholder in the private pages, on the
      # runner only, so it reaches the Access-gated wiki and nothing else. No
      # artifact is uploaded, and the step prints nothing.
      - name: Fill in the room link on the private pages
        if: steps.private.outputs.enabled == 'true'
        shell: pwsh
        env:
          ROOM_URL: ${{ secrets.DECOMP_ROOM_URL }}
        run: |
          $value = if ($env:ROOM_URL -match '^https://\S+$') { "<$($env:ROOM_URL)>" } else { '*not set in this build*' }
          Get-ChildItem _private/private -Recurse -File -Filter *.md | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName)
            if ($text.Contains('DECOMP-ROOM-LINK')) { [IO.File]::WriteAllText($_.FullName, $text.Replace('DECOMP-ROOM-LINK', $value)) }
          }

      - name: Read pinned Hugo version
        id: hugo
        run: echo "version=$(cat ewiki/.hugo-version)" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # why: the wiki vendors the shared theme (barefootbetters/bb-studio-ewiki-theme,
      # Legendary Arena D-24728). The digest is pinned here, outside the vendored
      # tree, and checked with plain shell before the vendored checker runs, so
      # an edited theme copy or an edited checker can't certify itself. When
      # upgrading the theme, re-sync the tag and paste its release-notes digest.
      - name: Check the vendored theme against its pinned digest
        env:
          PINNED_DIGEST: a4b239f94b6719a07e24e180f0162ce1372fd93fdf55eba8714c0fed3617bd9e   # bb-studio-ewiki-theme v1.5.1
        run: |
          set -e
          manifest_digest=$(tr -d '\r' < ewiki/themes/ewiki/.theme-manifest.txt | sha256sum | cut -d' ' -f1)
          if [ "$manifest_digest" != "$PINNED_DIGEST" ]; then
            echo "::error::ewiki/themes/ewiki doesn't match the pinned theme digest ($manifest_digest, not $PINNED_DIGEST). Re-sync the release with tools/Sync-EwikiTheme.ps1, or update PINNED_DIGEST when upgrading on purpose."
            exit 1
          fi
          checker_hash=$(tr -d '\r' < ewiki/themes/ewiki/tools/Test-EwikiTheme.ps1 | sha256sum | cut -d' ' -f1)
          if ! grep -qx "$checker_hash  tools/Test-EwikiTheme.ps1" ewiki/themes/ewiki/.theme-manifest.txt; then
            echo "::error::ewiki/themes/ewiki/tools/Test-EwikiTheme.ps1 doesn't match its manifest line, so it was edited. Re-sync the theme."
            exit 1
          fi
          echo "Theme manifest digest and checker hash match ($manifest_digest)."

      # why: fails on any edited, missing or extra vendored file, and on an
      # ewiki/layouts file (through the mounts) that shadows a core theme file.
      - name: Check the vendored theme copy and core shadows
        shell: pwsh
        env:
          PINNED_DIGEST: a4b239f94b6719a07e24e180f0162ce1372fd93fdf55eba8714c0fed3617bd9e   # bb-studio-ewiki-theme v1.5.1
        run: pwsh -File ewiki/themes/ewiki/tools/Test-EwikiTheme.ps1 -Site . -Config ewiki/hugo.toml -ExpectedManifestSha256 $env:PINNED_DIGEST

      # why: the theme's five gates (build, page count, determinism, Pagefind
      # 1.5.2, JS-free). The build runs without -PanicOnWarning: about 50 pages
      # use raw HTML (mostly <br> in tables) that the build drops with a
      # warning, so a strict build would fail. The page count is computed from
      # the allow-list so it never goes stale: one page per allow-listed
      # Markdown file, one list page per top-level folder holding one, and the
      # home page. The regex mirrors the mount `files` list in ewiki/hugo.toml;
      # change both in the same PR, or this gate fails red, which is the point.
      - name: Build and gate the site
        shell: pwsh
        run: |
          $allowList = '^(README\.md|docs/.*\.md|tools/(exes|samples)/README\.md)$'
          $pages = @(git ls-files | Where-Object { $_ -match $allowList })
          $sections = @($pages | Where-Object { $_.Contains('/') } | ForEach-Object { $_.Split('/')[0] } | Sort-Object -Unique)
          $expected = $pages.Count + $sections.Count + 1
          # why: the private mount adds its Markdown files plus one section list.
          $private = @(if (Test-Path _private/private) { Get-ChildItem _private/private -Recurse -File -Filter *.md })
          if ($private.Count) { $expected += $private.Count + 1 }
          Write-Host "Expected pages: $($pages.Count) Markdown files + $($sections.Count) section lists + 1 home + $($private.Count) private (+1 list if any) = $expected."
          pwsh -File ewiki/themes/ewiki/tools/Invoke-WikiGates.ps1 -Site . -Config ewiki/hugo.toml -ExpectedPageCount $expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Deploys only from main, and only once the Cloudflare secrets exist.
      # Jeff adds them after the Access app is in place, so the site is never
      # up without its gate.
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ewiki
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::NOT DEPLOYED. The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets are not set, so scooby-engine-ewiki.barefootbetters.com was not updated."
            exit 0
          fi
          npx --yes wrangler@4.149.0 deploy
